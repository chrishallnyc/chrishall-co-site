<style>
:root{
  --paper:#f6f4ee; --paper-dot:#d9d4c4; --ink:#18181c; --mid:#56565e; --dim:#8a887f;
  --night:#0a0a0c; --night-ink:#d8d4c8; --night-mid:#8f8c82; --night-dim:#55534c;
  --gold-hi:#f7e7b0; --gold:#d9b45e; --gold-lo:#8a6a2f; --gold-shadow:#4d3a12;
  --linen:#ece6d6; --acc:#e8b46f;
  --t-fade:2200ms; --t-ui:420ms;
  --wall:var(--paper); --wink:var(--ink); --wmid:var(--mid); --wdim:var(--dim);
}
html.night{ --wall:var(--night); --wink:var(--night-ink); --wmid:var(--night-mid); --wdim:var(--night-dim); }
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--wall); color:var(--wink);
  font-family:"SF Mono", ui-monospace, Menlo, Consolas, monospace;
  font-size:13px; line-height:1.5; overflow:hidden;
  transition:background 2.2s ease, color 2.2s ease;
}
html.hidecursor, html.hidecursor *{cursor:none !important}

/* ── the wall ── */
#wall{position:fixed; inset:0; overflow:hidden}
#wall::before{ /* dot-grid plaster, daylight only */
  content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(circle, var(--paper-dot) 1.1px, transparent 1.55px) 0 0 / 20px 20px;
  opacity:1; transition:opacity 2.2s ease;
}
html.night #wall::before{opacity:.05}
#wall::after{ /* quiet vignette at night */
  content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(0,0,0,.5) 130%);
  opacity:0; transition:opacity 2.2s ease;
}
html.night #wall::after{opacity:.8}
#stage{position:absolute; inset:0; z-index:1; transition:transform 3s ease}
html.dim #stage{filter:brightness(.65); transition:filter 30s linear, transform 3s ease}

/* ── a hung work: gilded frame, linen liner, brass plate ── */
.work{position:absolute; opacity:0; transition:opacity var(--t-fade) ease; will-change:opacity; z-index:2}
.work.up{opacity:1}
.work.z{z-index:3}
.frame{ /* gilding: per-rail bevel via conic quadrants (top lit, bottom shaded), mitre seams
          on the diagonals, milled texture, and a per-work sheen angle (--sheen) */
  position:relative;
  background:
    repeating-linear-gradient(45deg, rgba(120,90,25,.13) 0 2px, transparent 2px 5px),
    linear-gradient(var(--sheen,133deg), rgba(255,244,205,0) 30%, rgba(255,244,205,.30) 46%, rgba(255,244,205,0) 62%),
    conic-gradient(from -45deg,
      #ecd48f 0deg, #f5e5ac 24deg, #e6c778 66deg, #dcb761 87deg,
      #a8842f 92deg, #b6913a 132deg, #9a7628 177deg,
      #6f571f 183deg, #85682a 222deg, #6a521c 267deg,
      #b6913a 273deg, #c49d43 312deg, #ad8832 356deg, #ecd48f 360deg);
  border:1px solid #3b2c0e; border-radius:2px;
  box-shadow:
    inset 0 0 0 1px rgba(255,241,196,.55),
    inset 0 0 0 3px rgba(94,71,24,.5),
    0 2px 6px rgba(0,0,0,.28), 0 14px 44px rgba(0,0,0,.30);
}
.frame::after{ /* fillet ring — one turned step in the molding */
  content:""; position:absolute; inset:calc(var(--fw,24px)*0.34); pointer-events:none;
  box-shadow:0 0 0 1px rgba(80,60,18,.5), 0 0 0 2px rgba(255,241,196,.25);
  border-radius:1px;
}
html.night .frame{box-shadow:
    inset 0 0 0 1px rgba(255,241,196,.5),
    inset 0 0 0 3px rgba(94,71,24,.55),
    0 0 0 1px rgba(247,231,176,.10),
    0 -14px 50px rgba(232,180,111,.05),
    0 3px 10px rgba(0,0,0,.6), 0 22px 60px rgba(0,0,0,.55)}
.bead{background:linear-gradient(135deg,#6b5320,#a8842f 45%,#5e4718); padding:2px; border-radius:1px}
.liner{background:var(--linen); position:relative;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.liner::after{ /* rebate shadow over the canvas */
  content:""; position:absolute; inset:var(--lw,12px); pointer-events:none;
  box-shadow:inset 0 2px 7px rgba(0,0,0,.34), inset 0 0 1px rgba(0,0,0,.4);
}
.work img{display:block; background:#222}
.work.bare .frame{background:none; border-color:transparent; box-shadow:0 14px 44px rgba(0,0,0,.3)}
.work.bare .frame::after{display:none}
.work.bare .bead{background:none; padding:0}
.work.bare .liner{background:none; box-shadow:none}
.work.bare .liner::after{display:none}

.plate{
  position:absolute; left:50%; transform:translateX(-50%);
  margin-top:12px; /* hang clear of the frame's shadow penumbra */
  text-align:center; white-space:normal;
  font-size:10px; line-height:1.45; letter-spacing:.14em; color:var(--wmid);
  padding:0 10px; max-width:100%; width:max-content;
  opacity:0; transition:opacity 900ms ease;
}
.plate.on{opacity:1}
.plate b{color:var(--wink); font-weight:600; letter-spacing:.18em}
.plate .yr{color:var(--wdim)}
.plate .mus{display:block; font-size:9.5px; letter-spacing:.12em; color:var(--wdim); margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
html.night .plate .mus, html.night .plate .yr{color:#6b6960}

/* ── the door ── */
#door{
  position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
  background:var(--paper); color:var(--ink); cursor:pointer;
  transition:opacity 1.4s ease;
}
#door::before{content:""; position:absolute; inset:0;
  background:radial-gradient(circle, var(--paper-dot) 1.1px, transparent 1.55px) 0 0 / 20px 20px}
#door.gone{opacity:0; pointer-events:none}
.doorcard{position:relative; text-align:center; padding:38px 46px; max-width:520px}
.doorcard .wordmark{font-size:21px; letter-spacing:.46em; font-weight:600; text-indent:.46em}
.doorcard .rule{width:120px; height:1px; background:var(--ink); opacity:.35; margin:16px auto}
.doorcard .sub{font-size:11px; letter-spacing:.2em; color:var(--mid)}
.doorcard .counts{font-size:10px; letter-spacing:.18em; color:var(--dim); margin-top:14px}
.doorcard .enter{font-size:10px; letter-spacing:.22em; color:var(--dim); margin-top:30px}
.doorcard .enter b{color:var(--ink); font-weight:600}
@keyframes doorpulse{0%,100%{opacity:.55}50%{opacity:1}}
.doorcard .enter{animation:doorpulse 3.4s ease-in-out infinite}

/* ── quiet chrome ── */
#hint{
  position:fixed; right:18px; bottom:14px; z-index:30;
  font-size:10px; letter-spacing:.16em; color:var(--wdim);
  opacity:0; transition:opacity 1s ease; pointer-events:none; text-align:right;
}
#hint.on{opacity:1}
#toast{
  position:fixed; left:50%; top:26px; transform:translateX(-50%);
  z-index:31; font-size:10px; letter-spacing:.2em; color:var(--wink);
  background:var(--wall); /* fallback for no-color-mix browsers */
  background:color-mix(in srgb, var(--wall) 82%, transparent);
  border:1px solid var(--wdim); padding:6px 14px 5px;
  opacity:0; transition:opacity .5s ease; pointer-events:none;
}
#toast.on{opacity:1}

/* ── overlays: rooms + keys + audit ── */
.sheet{
  position:fixed; inset:0; z-index:35; display:none;
  align-items:center; justify-content:center;
  background:var(--wall); /* fallback for no-color-mix browsers */
  background:color-mix(in srgb, var(--wall) 76%, transparent);
  -webkit-backdrop-filter:blur(9px); backdrop-filter:blur(9px);
}
.sheet.open{display:flex}
.panel{border:1px solid var(--wink); background:var(--wall); padding:26px 34px; max-width:min(520px, 92vw); max-height:82vh; overflow:auto; position:relative}
.panel::after{content:""; position:absolute; inset:3px; border:1px solid var(--wdim); pointer-events:none}
.panel h2{font-size:12px; letter-spacing:.34em; font-weight:600; margin-bottom:16px; text-indent:.34em; text-align:center}
.panel .row{display:flex; justify-content:space-between; gap:26px; padding:5px 2px; font-size:11px; letter-spacing:.12em; cursor:pointer; border:0; background:none; color:var(--wmid); width:100%; font-family:inherit; text-align:left}
.panel .row:hover, .panel .row.cur{color:var(--wink)}
.panel .row .n{color:var(--wdim)}
.panel .keysrow{cursor:default}
.panel .keysrow:hover{color:var(--wmid)}
.panel .keysrow b{color:var(--wink); font-weight:600; min-width:64px; display:inline-block}
#audit{position:fixed; z-index:50; inset:0; overflow:auto; background:var(--paper); color:var(--ink); padding:30px; display:none; white-space:pre-wrap; font-size:11px; line-height:1.7}

@media (max-width:480px){
  .doorcard{padding:30px 20px}
  .doorcard .sub,.doorcard .counts,.doorcard .enter{text-wrap:balance}
}
@media (prefers-reduced-motion: reduce){
  :root{--t-fade:340ms}
  .doorcard .enter{animation:none; opacity:1}
  #stage{transition:none}
  body{transition:none}
}
</style>
</head>

/* ── the sun (NOAA-lite: offset meridian at lat 40, admin fallback tier) ── */
const SUN={fault:false};
function sunPair(d){ /* rise/set for the LOCAL calendar date of d; UT attached to that UTC date (may wrap) */
  try{
    const lat=40, lon=-(d.getTimezoneOffset())/4; /* minutes west -> degrees east neg */
    const rad=Math.PI/180;
    const dayN=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);
    const calc=(rising)=>{
      const lngHour=lon/15, t=dayN+(((rising?6:18)-lngHour)/24);
      const M=(0.9856*t)-3.289;
      let L=M+(1.916*Math.sin(M*rad))+(0.020*Math.sin(2*M*rad))+282.634; L=((L%360)+360)%360;
      let RA=Math.atan(0.91764*Math.tan(L*rad))/rad; RA=((RA%360)+360)%360;
      RA+= (Math.floor(L/90)*90 - Math.floor(RA/90)*90); RA/=15;
      const sinDec=0.39782*Math.sin(L*rad), cosDec=Math.cos(Math.asin(sinDec));
      const cosH=(Math.cos(90.833*rad)-(sinDec*Math.sin(lat*rad)))/(cosDec*Math.cos(lat*rad));
      if(cosH>1||cosH<-1) return null; /* polar */
      let H=rising?360-Math.acos(cosH)/rad:Math.acos(cosH)/rad; H/=15;
      let T=H+RA-(0.06571*t)-6.622;
      let UT=((T-lngHour)%24+24)%24;
      const md=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
      return new Date(md.getTime()+UT*3600e3);
    };
    return {rise:calc(true), set:calc(false)};
  }catch(e){SUN.fault=true; return {rise:null,set:null};}
}
function sunEvents(d){ /* sorted horizon crossings bracketing d (UT day-wrap safe: sweep local dates -1..+1) */
  const evs=[];
  for(let k=-1;k<=1;k++){
    const dd=new Date(d.getFullYear(),d.getMonth(),d.getDate()+k,12,0,0);
    const {rise,set}=sunPair(dd);
    if(rise)evs.push({t:rise,up:true});
    if(set)evs.push({t:set,up:false});
  }
  return evs.sort((a,b)=>a.t-b.t);
}
function sunTimes(d){ /* nearest rise/set around d, for display/QA */
  const evs=sunEvents(d);
  let rise=null,set=null;
  for(const e of evs){if(e.up&&(!rise||Math.abs(e.t-d)<Math.abs(rise-d)))rise=e.t;if(!e.up&&(!set||Math.abs(e.t-d)<Math.abs(set-d)))set=e.t}

}
function isNightAt(d){
  const evs=sunEvents(d);
  let last=null;
  for(const e of evs) if(e.t<=d) last=e;
  if(!last||SUN.fault) return d.getHours()<7||d.getHours()>=19;
  return !last.up;
}

/* ── seeded order ("tonight's hanging" is the same all day) ── */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function daySeed(){const d=now();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function shuffled(arr,seed){const rnd=mulberry32(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

try{const d=parseFloat(localStorage.getItem('salon:dwell'));if(!isFinite(P_DWELL)&&isFinite(d)&&d>=8000)DWELL=d}catch(e){}
let INFO_HOLD=false, PAUSED=false, entered=false;
let SEED=P_SEED?parseInt(P_SEED,10)||daySeed():daySeed();

function pool(){const dead=DEAD;return COLLECTION.filter(w=>!dead[w.id]&&(!ROOM||w.room===ROOM))}
let order=[], cursor=0;
function reorder(keepCursor){
  const p=pool(); order=shuffled(p,SEED);
  if(P_WORK){const i=order.findIndex(w=>w.id===P_WORK); if(i>0){const [w]=order.splice(i,1); order.unshift(w);}}
  if(!keepCursor) cursor=0;
}
function nextWork(){
  if(!order.length)return null;
  for(let k=0;k<order.length;k++){
    const w=order[((cursor%order.length)+order.length)%order.length];cursor++;
    if(!DEAD[w.id])return w;
  }
  return null;
}

/* ── stage geometry ── */
const stage=document.getElementById('stage');
function slotBoxes(){
  const W=innerWidth,H=innerHeight;
  const mx=Math.max(28,W*0.05), my=Math.max(26,H*0.075);
  if(MODE==='solo') return [{x:W/2,y:H/2,w:W-2*mx,h:H-2*my}];
  const landscape=W/H>=1.02;
  if(landscape){
    const gap=Math.max(18,W*0.028), bw=(W-2*mx-2*gap)/3, bh=H-2*my;
    return [0,1,2].map(i=>({x:mx+bw/2+i*(bw+gap),y:H/2,w:bw,h:bh}));
  }
  const gap=Math.max(16,H*0.022), bh=(H-2*my-2*gap)/3, bw=W-2*mx;
  return [0,1,2].map(i=>({x:W/2,y:my+bh/2+i*(bh+gap),w:bw,h:bh}));
}
function fitWork(work,box){
  const solo=MODE==='solo';
  const f=Math.max(10,Math.min((solo?0.046:0.036)*Math.min(box.w,box.h),54)); /* molding */
  const l=Math.max(6,f*0.55);                                                 /* linen liner */
  const plate=46; /* reserved symmetrically (fig centers on the frame; the plate hangs below) */
  const chrome=f+2+l;
  const availW=box.w-2*chrome, availH=box.h-2*chrome-2*plate;
  const a=work.w/work.h;
  let iw=Math.min(availW,availH*a), ih=iw/a;
  if(ih>availH){ih=availH;iw=ih*a}
  return {f,l,iw:Math.max(40,iw),ih:Math.max(40,ih)};
}

/* ── image loading with tier failover ── */
function pickTier(work,box){
  const target=Math.min(3900,(devicePixelRatio||1)*box.w);
  const asc=[...work.srcs].sort((a,b)=>a.w-b.w);
  for(const s of asc) if(s.w>=target) return work.srcs.indexOf(s);
  return 0; /* largest (srcs are desc) */
}
function loadOne(url,timeout){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.referrerPolicy='no-referrer'; /* AIC's WAF 403s foreign/localhost referers; no-referrer gets 200 everywhere */
    const t=setTimeout(()=>{img.src='';rej(new Error('timeout'))},timeout||25000);
    img.onload=()=>{clearTimeout(t); (img.decode?img.decode().catch(()=>{}):Promise.resolve()).then(()=>res(img))};
    img.onerror=()=>{clearTimeout(t);rej(new Error('error'))};
    img.src=url;
  });
}
let NET_OK=false; /* proof the network can load art at all — gates the quarantine */
async function loadWork(work,box){
  const start=pickTier(work,box);
  const tried=new Set();
  const orderT=[start,...work.srcs.map((_,i)=>i)].filter(i=>{if(tried.has(i))return false;tried.add(i);return true});
  for(const i of orderT){
    try{const img=await loadOne(work.srcs[i].u); NET_OK=true; return {img,tier:i};}
    catch(e){}
  }
  /* bury only when the failure is provably the WORK's fault, not the network's,
     and never let the graveyard eat more than 15% of the collection */
  if(navigator.onLine&&NET_OK&&Object.keys(DEAD).length<COLLECTION.length*0.15) bury(work.id);
  throw new Error('all tiers unreachable: '+work.id);
}
const preloads=new Map();
function prefetch(){
  if(!order.length)return;
  const w=order[((cursor%order.length)+order.length)%order.length];
  if(!w||preloads.has(w.id))return;
  const box=slotBoxes()[0];
  const p=loadWork(w,box).catch(()=>null);
  preloads.set(w.id,p);
  if(preloads.size>3){const k=preloads.keys().next().value; preloads.delete(k);}
}

/* ── hanging ── */
const slots=[]; /* {el, work, hungAt} */
function buildWorkEl(work,img,box){
  const g=fitWork(work,box);
  const fig=document.createElement('figure');
  fig.className='work'+(FRAMES?'':' bare');
  fig.dataset.id=work.id;
  const frame=document.createElement('div');frame.className='frame';frame.style.padding=g.f+'px';
  frame.style.setProperty('--fw',g.f+'px');
  let hsh=0;for(const ch of work.id)hsh=(hsh*31+ch.charCodeAt(0))|0; /* per-work sheen angle — no two frames wear the same light */
  frame.style.setProperty('--sheen',(122+(Math.abs(hsh)%24))+'deg');
  const bead=document.createElement('div');bead.className='bead';
  const liner=document.createElement('div');liner.className='liner';liner.style.padding=g.l+'px';liner.style.setProperty('--lw',g.l+'px');
  img.width=Math.round(g.iw);img.height=Math.round(g.ih);
  img.style.width=g.iw+'px';img.style.height=g.ih+'px';
  img.alt=work.artist+' — '+work.title;
  liner.appendChild(img);bead.appendChild(liner);frame.appendChild(bead);fig.appendChild(frame);
  const plate=document.createElement('figcaption');plate.className='plate';
  plate.innerHTML='<b>'+esc(work.artist.toUpperCase())+'</b> · '+esc(work.title)+', <span class="yr">'+esc(work.year)+'</span><span class="mus">'+esc(work.museum)+'</span>';
  fig.appendChild(plate);
  place(fig,box);
  return fig;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function place(fig,box){
  fig.style.left=box.x+'px';fig.style.top=box.y+'px';
  fig.style.transform='translate(-50%,-50%)';
}
function showPlate(fig){
  const plate=fig.querySelector('.plate');
  plate.classList.add('on');
  if(!INFO_HOLD){clearTimeout(plate._t);plate._t=setTimeout(()=>plate.classList.remove('on'),9000)}
}
let hangSeq=0; /* wall generation — furnish() bumps it; stale in-flight hangs check it and yield */
async function hang(slotIdx,work){
  if(!work)return false;
  const gen=hangSeq;
  const boxes=slotBoxes(), box=boxes[slotIdx]||boxes[0];
  let got=null;
  if(preloads.has(work.id)){const p=preloads.get(work.id);preloads.delete(work.id);got=await p;}
  if(!got){try{got=await loadWork(work,box)}catch(e){return false}}
  if(!got)return false;
  if(gen!==hangSeq)return false; /* a newer wall superseded this hang while the image loaded */
  const fig=buildWorkEl(work,got.img,box);
  fig.classList.add('z');
  stage.appendChild(fig);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{fig.classList.add('up')}));
  const old=slots[slotIdx]&&slots[slotIdx].el;
  slots[slotIdx]={el:fig,work,hungAt:Date.now()};
  if(old){old.classList.remove('up');setTimeout(()=>old.remove(),(REDUCED?400:2400))}
  setTimeout(()=>{fig.classList.remove('z');showPlate(fig)},REDUCED?80:1200);
  drift();
  prefetch();
  return true;
}
let driftFlip=1;
function drift(){
  if(REDUCED)return;
  driftFlip*=-1;
  stage.style.transform='translate('+(driftFlip*2)+'px,'+(-driftFlip*1.5)+'px)';
}
function oldestSlot(){
  const n=MODE==='solo'?1:3;
  let idx=0,best=Infinity;
  for(let i=0;i<n;i++){const s=slots[i];const t=s?s.hungAt:0;if(t<best){best=t;idx=i}}
  return idx;
}
let advancing=false;
async function advance(){
  if(advancing)return false;
  if(!navigator.onLine){toast('offline — the wall waits');return false}
  advancing=true;
  try{
    for(let tries=0;tries<Math.min(8,order.length||1);tries++){
      if(await hang(oldestSlot(),nextWork()))return true;
      if(!navigator.onLine){toast('offline — the wall waits');return false}
    }
    toast('the wall is dark — no images reachable');
    return false;
  }finally{advancing=false}
}
async function rewind(){
  const n=MODE==='solo'?1:3;
  cursor-=n+1;
  for(let t=0;t<4;t++){if(await hang(oldestSlot(),nextWork()))return}
}

/* ── the rotation clock ── */
let tickT=null;
function beat(){return MODE==='solo'?DWELL:Math.max(12000,DWELL*0.5)}
function armTick(){
  clearTimeout(tickT);
  if(STILL||PAUSED||!entered||document.hidden)return;
  tickT=setTimeout(async()=>{await advance();armTick()},beat());
}
function pause(p){PAUSED=p===undefined?!PAUSED:p;armTick();toast(PAUSED?'paused':'resumed');}

/* ── wall furnishing (mode/room switches rebuild the wall) ── */
async function furnish(){
  hangSeq++;
  const gen=hangSeq;
  slots.splice(0).forEach(s=>{if(s&&s.el){s.el.classList.remove('up');setTimeout(()=>s.el.remove(),(REDUCED?400:2400))}});
  const n=MODE==='solo'?1:3;
  let lit=0;
  for(let i=0;i<n;i++){
    if(gen!==hangSeq)return; /* a newer furnish took the wall */
    let ok=false;
    for(let t=0;t<6&&!ok;t++){ /* the first work must not be a blank-wall lottery — retry through the order */
      const w=nextWork(); if(!w)break;
      ok=await hang(i,w);
      if(gen!==hangSeq)return;
    }
    if(ok){lit++; if(!REDUCED&&i<n-1)await new Promise(r=>setTimeout(r,650));}
  }
  if(!lit)toast(navigator.onLine?'the wall is dark — no images reachable':'offline — the wall waits');
  armTick();
}
function relayout(){
  const boxes=slotBoxes();
  const n=MODE==='solo'?1:3;
  for(let i=0;i<n;i++){
    const s=slots[i];if(!s||!s.el)continue;
    const box=boxes[i]||boxes[0];
    const g=fitWork(s.work,box);
    const img=s.el.querySelector('img');
    s.el.querySelector('.frame').style.padding=g.f+'px';
    const liner=s.el.querySelector('.liner');liner.style.padding=g.l+'px';liner.style.setProperty('--lw',g.l+'px');
    img.style.width=g.iw+'px';img.style.height=g.ih+'px';
    place(s.el,box);
  }
}
let rzT=null;
addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(relayout,140)});

/* ── wake lock ── */
let wake=null;
async function keepAwake(){
  try{if('wakeLock'in navigator&&!document.hidden){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null});}}catch(e){}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){clearTimeout(tickT)}
  else{if(entered){keepAwake();applyWall();armTick()}}
});

/* ── chrome: toast, hint, sheets ── */
const toastEl=document.getElementById('toast');let toastT=null;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),2600)}
const hintEl=document.getElementById('hint');
function hint(){
  const coarse=matchMedia('(pointer: coarse)').matches&&!matchMedia('(any-pointer: fine)').matches;
  hintEl.textContent=coarse
    ?'swipe to walk · tap for plates · double-tap fullscreen'
    :'space pause · ← → walk · v wall of three · g rooms · ? keys';
  hintEl.classList.add('on');setTimeout(()=>hintEl.classList.remove('on'),8000);
}
const roomsSheet=document.getElementById('roomsSheet'),keysSheet=document.getElementById('keysSheet');
function buildRoomList(){
  const el=document.getElementById('roomList');el.innerHTML='';
  const all=document.createElement('button');all.className='row'+(ROOM?'':' cur');
  all.innerHTML='<span>EVERY ROOM</span><span class="n">'+COLLECTION.length+'</span>';
  all.onclick=()=>{setRoom(null)};el.appendChild(all);
  for(const r of ROOMS){
    const n=COLLECTION.filter(w=>w.room===r.slug).length;if(!n)continue;
    const b=document.createElement('button');b.className='row'+(ROOM===r.slug?' cur':'');
    b.innerHTML='<span>'+esc(r.label)+'</span><span class="n">'+n+'</span>';
    b.onclick=()=>{setRoom(r.slug)};el.appendChild(b);
  }
}
function setRoom(slug){
  clearTimeout(tickT);
  ROOM=slug;reorder();roomsSheet.classList.remove('open');
  toast(slug?(ROOMS.find(r=>r.slug===slug)||{}).label:'EVERY ROOM');
  furnish();
}
const KEYS=[['space','pause / resume'],['← →','walk back / forward'],['v','one work / a wall of three'],['i','hold the plates'],['f','fullscreen'],['m','wall: sun / day / night'],['b','frames on / off'],['g','the rooms'],['[ ]','slower / faster'],['?','these keys']];
(function(){const el=document.getElementById('keyList');
  for(const [k,v] of KEYS){const d=document.createElement('div');d.className='row keysrow';d.innerHTML='<span><b>'+k+'</b></span><span>'+v+'</span>';el.appendChild(d)}})();
function closeSheets(){roomsSheet.classList.remove('open');keysSheet.classList.remove('open')}

/* ── input ── */
function setMode(m){
  clearTimeout(tickT);
  MODE=m;try{localStorage.setItem('salon:mode',m)}catch(e){}
  toast(m==='solo'?'one work':'a wall of three');
  cursor=Math.max(0,cursor-(m==='solo'?0:2));
  furnish();
}
function setFrames(on){
  FRAMES=on;try{localStorage.setItem('salon:bare',on?'0':'1')}catch(e){}
  document.querySelectorAll('.work').forEach(el=>el.classList.toggle('bare',!on));
  toast(on?'gilded':'bare canvas');
}
function cycleMat(){
  MAT=MAT==='auto'?'day':MAT==='day'?'night':'auto';
  try{localStorage.setItem('salon:mat',MAT)}catch(e){}
  applyWall(true);armSun();
  toast('wall follows '+(MAT==='auto'?'the sun':MAT));
}
function nudgeDwell(dir){
  const steps=[20,30,45,60,75,90,120,180,300,600];
  let i=steps.findIndex(s=>s*1000>=DWELL);if(i<0)i=steps.length-1;
  i=Math.max(0,Math.min(steps.length-1,i+dir));
  DWELL=steps[i]*1000;try{localStorage.setItem('salon:dwell',DWELL)}catch(e){}
  armTick();toast('a work every '+(steps[i]>=60?(steps[i]/60)+' min':steps[i]+' sec')+(MODE==='gallery'?' · wall swaps at half':''));
}
async function goFullscreen(){
  try{
    if(document.fullscreenElement){await document.exitFullscreen()}
    else{await document.documentElement.requestFullscreen({navigationUI:'hide'})}
  }catch(e){}
}
document.addEventListener('keydown',async e=>{
  if(!entered){if(e.key==='Enter'||e.key===' '){enter()}return}
  if(e.key==='Escape'){closeSheets();return}
  switch(e.key){
    case ' ':e.preventDefault();pause();break;
    case 'ArrowRight':clearTimeout(tickT);await advance();armTick();break;
    case 'ArrowLeft':clearTimeout(tickT);await rewind();armTick();break;
    case 'v':case 'V':setMode(MODE==='solo'?'gallery':'solo');break;
    case 'i':case 'I':INFO_HOLD=!INFO_HOLD;document.querySelectorAll('.plate').forEach(p=>{clearTimeout(p._t);p.classList.toggle('on',INFO_HOLD)});toast(INFO_HOLD?'plates held':'plates rest');break;
    case 'f':case 'F':goFullscreen();break;
    case 'm':case 'M':cycleMat();break;
    case 'b':case 'B':setFrames(!FRAMES);break;
    case 'g':case 'G':buildRoomList();keysSheet.classList.remove('open');roomsSheet.classList.toggle('open');break;
    case '?':document.getElementById('roomsSheet').classList.remove('open');keysSheet.classList.toggle('open');break;
    case '[':nudgeDwell(-1);break;
    case ']':nudgeDwell(1);break;
  }
});
let cursorT=null;
function armCursorHide(){
  document.documentElement.classList.remove('hidecursor');
  clearTimeout(cursorT);
  if(Q.get('cursor')==='1')return;
  cursorT=setTimeout(()=>document.documentElement.classList.add('hidecursor'),4200);
}
addEventListener('mousemove',()=>{if(entered)armCursorHide()});
/* touch: swipe walks, tap shows plates, double-tap fullscreen */
let tX=null,tY=null,lastTap=0;
addEventListener('touchstart',e=>{if(e.touches.length===1){tX=e.touches[0].clientX;tY=e.touches[0].clientY}},{passive:true});
addEventListener('touchend',async e=>{
  if(!entered||tX===null)return;
  const dx=(e.changedTouches[0].clientX-tX),dy=(e.changedTouches[0].clientY-tY);tX=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6){clearTimeout(tickT);if(dx<0)await advance();else await rewind();armTick();return}
  if(Math.abs(dx)<12&&Math.abs(dy)<12){
    const t=Date.now();
    if(t-lastTap<380){goFullscreen()}else{document.querySelectorAll('.work .plate').forEach(showPlateEl)}
    lastTap=t;
  }
},{passive:true});
function showPlateEl(plate){plate.classList.add('on');if(!INFO_HOLD){clearTimeout(plate._t);plate._t=setTimeout(()=>plate.classList.remove('on'),9000)}}

/* ── the door ── */
const door=document.getElementById('door');
document.getElementById('doorCounts').textContent=COLLECTION.length+' WORKS · '+ROOMS.filter(r=>COLLECTION.some(w=>w.room===r.slug)).length+' ROOMS · ALL PUBLIC DOMAIN';
async function enter(){
  if(entered)return;entered=true;
  door.classList.add('gone');
  setTimeout(()=>door.remove(),1600);
  goFullscreen();keepAwake();
  applyWall();armSun();armCursorHide();hint();
  await furnish();
}
door.addEventListener('click',enter);

/* ── service worker (https or explicit ?sw=1 for local QA; post-load, can't race boot) ── */
if('serviceWorker'in navigator&&(location.protocol==='https:'||Q.has('sw'))){
  addEventListener('load',()=>{setTimeout(()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})},2500)});
}

/* ── QA hooks ── */
window.__SALON={
  ver:SALON_VER,
  info(){return {ver:SALON_VER,works:COLLECTION.length,rooms:ROOMS.length,room:ROOM,mode:MODE,dwell:DWELL,paused:PAUSED,entered,cursor,seed:SEED,dead:Object.keys(DEAD).length,night:document.documentElement.classList.contains('night'),hung:slots.filter(Boolean).map(s=>s.work.id)}},
  async next(){clearTimeout(tickT);const r=await advance();armTick();return r},
  async prev(){clearTimeout(tickT);await rewind();armTick();return true},
  pause(){pause(true)},play(){pause(false)},
  mode(m){setMode(m)},room(s){setRoom(s)},
  sun(){const d=now();const {rise,set}=sunTimes(d);return {now:d.toISOString(),rise:rise&&rise.toISOString(),set:set&&set.toISOString(),night:isNightAt(d),mat:MAT,fault:SUN.fault}},
  enter(){enter()},
  dead(){return {...DEAD}},
  async verify(n){n=n||6;const rnd=mulberry32(Date.now()|0);const picks=shuffled(COLLECTION,Date.now()|0).slice(0,n);const out=[];for(const w of picks){try{await loadOne(w.srcs[w.srcs.length-1].u,15000);out.push([w.id,'ok'])}catch(e){out.push([w.id,'FAIL'])}}return out},
};

/* ── ?audit: self-check, no rotation ── */
function runAudit(){
  const L=[],F=[];
  const ok=(name,cond,note)=>{(cond?L:F).push((cond?'ok  ':'FAIL')+' '+name+(note?' — '+note:''))};
  ok('collection present',COLLECTION.length>=3,COLLECTION.length+' works');
  ok('collection baked',COLLECTION_V>=1,'COLLECTION_V='+COLLECTION_V+(COLLECTION_V<1?' (placeholder set)':''));
  const ids=new Set(COLLECTION.map(w=>w.id));
  ok('ids unique',ids.size===COLLECTION.length,ids.size+'/'+COLLECTION.length);
  const roomSlugs=new Set(ROOMS.map(r=>r.slug));
  ok('every work in a known room',COLLECTION.every(w=>roomSlugs.has(w.room)));
  ok('srcs descending',COLLECTION.every(w=>w.srcs.every((s,i)=>i===0||w.srcs[i-1].w>=s.w)));
  ok('dims present',COLLECTION.every(w=>w.w>0&&w.h>0));
  ok('primary >=1400px',COLLECTION.every(w=>Math.max(w.srcs[0].w,Math.round(w.srcs[0].w*w.h/w.w))>=1400));
  ok('labels complete',COLLECTION.every(w=>w.artist&&w.title&&w.year&&w.museum));
  const s1=shuffled(COLLECTION,1234).map(w=>w.id).join(','),s2=shuffled(COLLECTION,1234).map(w=>w.id).join(',');
  ok('seeded shuffle deterministic',s1===s2);
  const st=sunTimes(now());
  ok('sun engine answers',!!(st.rise&&st.set)&&!SUN.fault,st.rise?st.rise.toTimeString().slice(0,5)+' / '+st.set.toTimeString().slice(0,5):'polar/fault');
  ok('mode machinery',typeof setMode==='function'&&typeof furnish==='function');
  ok('quarantine machinery',typeof bury==='function');
  L.push('NOTE: salon '+SALON_VER+' · '+COLLECTION.length+' works · '+ROOMS.filter(r=>COLLECTION.some(w=>w.room===r.slug)).length+' rooms live');
  const el=document.getElementById('audit');
  el.textContent=(F.length?F.join('\n')+'\n':'')+L.join('\n')+'\n\n'+(F.length?'AUDIT-FAIL-SALON ('+F.length+')':'AUDIT-CLEAN-SALON');
  el.style.display='block';
  document.title=(F.length?'AUDIT-FAIL':'AUDIT-CLEAN-SALON')+' — THE SALON';
  door.remove();
}

/* ── boot ── */
reorder();
buildRoomList();
applyWall();
if(AUDIT){runAudit()}
else if(NO_DOOR){enter()}
</script>
