<head>

<style>
:root { --bg:#f6f4ee; --ink:#18181c; --mid:#56565e; --dim:#69675f; --hair:#989690; --acc:#e8b46f; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:var(--bg); height:100%; }
body {
  color:var(--ink);
  font-family:"SF Mono", ui-monospace, Menlo, Consolas, monospace;
  font-size:13px; line-height:1.6;
  min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
}
a { color:var(--mid); text-decoration:none; }
a:hover { color:var(--ink); text-decoration:underline; }
a:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
.sheet {
  position:relative; width:100%; max-width:560px;
  border:1px solid var(--ink); background:var(--bg);
  padding:44px clamp(24px,6vw,56px) 40px;
}
.sheet::after { content:""; position:absolute; inset:2px; border:1px solid var(--hair); pointer-events:none; }
.glyph { display:block; width:44px; height:44px; margin-bottom:26px; }
.brand { font-weight:700; letter-spacing:4px; font-size:15px; }
.rule { border:0; border-top:1px solid var(--hair); margin:20px 0; }
.line { color:var(--ink); max-width:42ch; }
.watch { display:inline-block; margin-top:22px; font-size:12px; letter-spacing:.5px; }
.foot { margin-top:36px; font-size:10px; letter-spacing:2px; color:var(--dim); }
</style>
</head>
<body>
<main class="sheet">
  <svg class="glyph" viewBox="0 0 32 32" aria-hidden="true">
    <rect width="32" height="32" fill="#f6f4ee"/>
    <path d="M1.5 19.4 L30.5 16.4" stroke="#989690" stroke-width="1"/>
    <path d="M3.5 19 C6.5 12.6 13.5 10.6 19.5 12 C24.5 13.2 28 15.4 29 16.6 C26 18.2 18.5 20.6 11.5 20.9 C7.5 21 4.5 20.3 3.5 19 Z" fill="#18181c"/>
    <circle cx="4.2" cy="19" r="2.4" fill="#e8b46f"/>
  </svg>
  <div class="brand">CHALL TUNNEL</div>
  <hr class="rule">
  <p class="line">a live wind tunnel is being built here — by a machine, in the open</p>
  <a class="watch" href="https://admin.chall.net/tunnel-mission">watch it being built → admin.chall.net/tunnel-mission</a>
  <p class="foot">tunnel.chall.net</p>
</main>
</body>
</html>
