<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIRCRAFT LAB</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23303338'/%3E%3C/svg%3E">
<style>
  html,body { margin:0; height:100%; background:#242930; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  #tag { position:fixed; left:22px; top:19px; color:#d2d7df; font:11px/1.6 ui-monospace,monospace;
         letter-spacing:2px; pointer-events:none; }
  #stats { display:block; color:#89939f; font-size:10px; letter-spacing:0.6px; margin-top:3px; }
  #tools { position:fixed; bottom:18px; left:18px; right:18px; display:flex; gap:5px; flex-wrap:wrap;
           align-items:center; font:10px ui-monospace,monospace; }
  #tools[hidden] { display:none; }
  button,select { color:#aab4c1; background:#1b2026dd; border:1px solid #49515b; border-radius:3px;
                  padding:7px 9px; font:inherit; cursor:pointer; }
  button:hover,select:hover,button[aria-pressed="true"] { color:#fff; border-color:#a5adb7; }
  select { margin-right:8px; }
  @media (max-width:600px) { #tag { left:14px; top:12px; } #tools { left:10px; bottom:10px; right:10px; gap:4px; }
    button,select { padding:6px 7px; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="tag"><span id="name">F-22 RAPTOR</span><span id="stats">Loading aircraft…</span></div>
<nav id="tools" aria-label="Aircraft inspection">
  <select id="aircraft" aria-label="Aircraft">
    <option value="f22">F-22 Raptor</option>
    <option value="fighter">Fighter</option>
    <option value="transport">Transport</option>
    <option value="drone">Drone</option>
  </select>
  <button data-view="three-quarter">Perspective</button>
  <button data-view="top">Top</button>
  <button data-view="side">Side</button>
  <button data-view="front">Front</button>
  <button data-view="rear">Rear</button>
  <button data-view="underside">Underside</button>
  <button data-view="cockpit">Cockpit</button>
  <button id="gear" aria-pressed="false">Gear</button>
  <button id="bays" aria-pressed="false">Weapon bays</button>
  <button id="spin" aria-pressed="false">Orbit</button>
</nav>

<script type="importmap">
{
  "imports": {
    "three": "/vendor/three.webgpu.min.js",
    "three/webgpu": "/vendor/three.webgpu.min.js",
    "three/tsl": "/vendor/three.tsl.min.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { syncMainBayDoors } from '/src/aircraft/weapons-bays.js';
import { syncGearBays } from '/src/aircraft/gear-bays.js';

const q = new URLSearchParams(location.search);
const aircraft = ["fighter", "transport", "drone"].includes(q.get("aircraft")) ? q.get("aircraft") : "f22";
const VIEW = q.get("view");
let spin = q.get("spin") !== "0" && !VIEW;
let gearDown = q.get("gear") === "1";
let baysOpen = q.get("bays") === "1";
const numberParam = (name, fallback, min, max) => {
  const value = q.has(name) ? Number(q.get(name)) : fallback;
  return Number.isFinite(value) ? Math.max(min, Math.min(max, value)) : fallback;
};

const lab = { ready: false, tris: 0, snap: null };
window.__F22LAB = lab;

// same one-context-forever caution as main.js: probe before construction
async function makeRenderer(canvas) {
  let adapter = null;
  if (navigator.gpu && q.get("gl") !== "1") {
    try { adapter = await navigator.gpu.requestAdapter(); } catch (_) { adapter = null; }
  }
  if (adapter) {
    try {
      const r = new THREE.WebGPURenderer({ canvas, antialias: true });
      await r.init();
      return { renderer: r, backend: "webgpu" };
    } catch (err) {
      const c = canvas.cloneNode(false); canvas.replaceWith(c); canvas = c;
    }
  }
  const r = new THREE.WebGPURenderer({ canvas, antialias: true, forceWebGL: true });
  await r.init();
  return { renderer: r, backend: "webgl" };
}

const { renderer, backend } = await makeRenderer(document.getElementById("cv"));
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = numberParam("exposure", 1.05, 0.15, 3);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x242930);

// Large studio reflectors make the canopy and metals legible. This uses
// the same PMREM / ACES path as the game, and works on both render backends.
const studio = new THREE.Scene();
studio.background = new THREE.Color(0x6d7888);
const room = new THREE.Mesh(new THREE.BoxGeometry(100, 70, 100),
  new THREE.MeshBasicMaterial({ color: 0x535961, side: THREE.BackSide }));
studio.add(room);
const reflector = (w, h, position, color, intensity) => {
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide }));
  panel.position.set(...position);
  panel.lookAt(0, 0, 0);
  studio.add(panel);
};
reflector(12, 35, [-17, 20, -12], 0xfff3dc, 5);
reflector(9, 30, [20, 12, 8], 0xc7dfff, 3);
reflector(28, 12, [0, 26, 5], 0xffffff, 4);
const pmrem = new THREE.PMREMGenerator(renderer);
try {
  const environment = pmrem.fromScene(studio, 0.025, 0.1, 150);
  scene.environment = environment.texture;
  scene.environmentIntensity = numberParam("ibl", 0.48, 0, 2);
  lab.environment = environment;
} catch (error) {
  console.warn("[f22lab] Studio reflections unavailable:", error.message);
}
pmrem.dispose();
studio.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });

const key = new THREE.DirectionalLight(0xfff1dd, 2.5);
key.position.set(-12, 20, -14);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -25; key.shadow.camera.right = 25;
key.shadow.camera.top = 25; key.shadow.camera.bottom = -25;
key.shadow.camera.near = 0.5; key.shadow.camera.far = 90;
key.shadow.normalBias = 0.025;
key.shadow.bias = -0.00005;
const fill = new THREE.DirectionalLight(0xc2d5ee, 0.85);
fill.position.set(12, 5, -2);
const rim = new THREE.DirectionalLight(0xe7efff, 1.7);
rim.position.set(0, 10, 16);
scene.add(key, fill, rim, new THREE.HemisphereLight(0xc0cad8, 0x444047, 0.55));

let group, parts;
if (aircraft === "f22") {
  const { buildF22 } = await import(q.get("v") === "2" ? "/src/aircraft/f22.js" : "/src/aircraft/f22v3.js");
  const built = buildF22();
  await built.ready;
  ({ group, parts } = built);
} else {
  const { buildBanditModels } = await import("/src/aircraft/bandit-models.js");
  const models = buildBanditModels();
  group = models[{ drone: 0, transport: 1, fighter: 2 }[aircraft]];
  group.rotation.y = Math.PI; // bandits use +Z forward; lab uses -Z forward.
  parts = {};
}
scene.add(group);
window.__F22PARTS = parts;
const names = { f22: "F-22 RAPTOR", fighter: "TWIN-ENGINE FIGHTER", transport: "TACTICAL TRANSPORT", drone: "RECONNAISSANCE DRONE" };
document.getElementById("name").textContent = names[aircraft];
document.getElementById("aircraft").value = aircraft;
document.getElementById("gear").hidden = aircraft !== "f22";
document.getElementById("bays").hidden = aircraft !== "f22";

function setGear(down) {
  gearDown = Boolean(down);
  if (aircraft === "f22") syncGearBays(group,Number(down));
  document.getElementById("gear").setAttribute("aria-pressed", String(down));
}
setGear(gearDown);
function setBays(open) {
  baysOpen = open;
  if (parts.bayMain) parts.bayMain.rotation.z = open ? -95 * Math.PI / 180 : 0;
  syncMainBayDoors(parts);
  if(parts.baySideR)parts.baySideR.rotation.z=open?80*Math.PI/180:0;
  if(parts.baySideL)parts.baySideL.rotation.z=open?-80*Math.PI/180:0;
  document.getElementById('bays').setAttribute('aria-pressed', String(open));
}
setBays(baysOpen);

let tris = 0;
group.traverse((o) => {
  if (o.isMesh) {
    o.castShadow = !o.material.transparent && !(o.material.transmission > 0);
    o.receiveShadow = !o.material.transparent && !(o.material.transmission > 0);
    const p = o.geometry.getAttribute("position");
    tris += (o.geometry.index ? o.geometry.index.count : p.count) / 3;
  }
});
lab.tris = Math.round(tris);
console.log("[f22lab] tris:", lab.tris);

const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 500);
const bounds = new THREE.Box3().setFromObject(group);
const size = bounds.getSize(new THREE.Vector3());
const scale = Math.max(size.x, size.z) / 19.2;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000),
  new THREE.MeshStandardMaterial({ color: 0x272c33, roughness: 0.94, metalness: 0 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = bounds.min.y - 0.08;
ground.receiveShadow = true;
scene.add(ground);
Object.assign(lab, { scene, camera: cam, renderer, group, parts, backend, aircraft });
let exhaust = null;
const enginePreview = q.get('ab') === '1' && aircraft === 'f22';
if (enginePreview) {
  const { FlightFX } = await import('/src/game/flightfx.js');
  exhaust = new FlightFX(scene, { jetGroup: group, parts });
  // Fixed settled state makes captures reproducible.
  for (let i = 0; i < 180; i++) exhaust.update({ mach: .85, alphaDeg: 0, nz: 1 }, 1.1, 1 / 60, cam);
  lab.exhaust = exhaust;
}

function park(view) {
  lab.view = view;
  cam.up.set(0, 1, 0);
  ground.visible = view !== "underside";
  cam.fov = 32;
  let target = [0, 0.2, 0.5];
  if (view === "top")        { cam.fov = 25; cam.position.set(0, 51, 0); cam.up.set(0, 0, -1); }
  else if (view === "side")  { cam.fov = 25; cam.position.set(49, 0.7, 0); }
  else if (view === "front") { cam.fov = 25; cam.position.set(0, 1.2, -39); }
  else if (view === "rear")  { cam.fov = 30; cam.position.set(11.5, 4.8, 24); target = [0, 0.15, 2.7]; }
  else if (view === "underside") { cam.position.set(15, -13, -19); }
  else if (view === "cockpit") { cam.fov = 36; cam.position.set(4.2, 2.8, -7.9); target = [0, 0.7, -4.5]; }
  else                       { cam.position.set(17, 9, -21); }
  cam.position.multiplyScalar(scale);
  cam.lookAt(...target.map((value) => value * scale));
  // Keep the same whole-aircraft framing on tall browser windows.
  if (cam.aspect < 1 && view !== "cockpit") cam.fov += (1 - cam.aspect) * 22;
  cam.updateProjectionMatrix();
  document.querySelectorAll("[data-view]").forEach((button) =>
    button.setAttribute("aria-pressed", String(button.dataset.view === view)));
}

let t = 0;
function orbit() {
  t += 0.0035;
  ground.visible = true;
  cam.up.set(0, 1, 0);
  cam.fov = 30;
  cam.position.set(Math.sin(t) * 30 * scale, 9 * scale, Math.cos(t) * 30 * scale);
  cam.lookAt(0, 0.3 * scale, 0);
  cam.updateProjectionMatrix();
}

if (VIEW || !spin) park(VIEW || "three-quarter"); else orbit();
lab.setView = (view) => { spin = false; park(view); document.getElementById("spin").setAttribute("aria-pressed", "false"); };
lab.setGear = setGear;
lab.setBays = setBays;
document.querySelectorAll("[data-view]").forEach((button) => {
  button.addEventListener("click", () => lab.setView(button.dataset.view));
});
document.getElementById("aircraft").addEventListener("change", (event) => {
  const url = new URL(location.href);
  url.searchParams.set("aircraft", event.target.value);
  location.href = url.href;
});
document.getElementById("gear").addEventListener("click", () => setGear(!gearDown));
document.getElementById("bays").addEventListener("click", () => setBays(!baysOpen));
document.getElementById("spin").setAttribute("aria-pressed", String(spin));
document.getElementById("spin").addEventListener("click", () => {
  spin = !spin;
  document.getElementById("spin").setAttribute("aria-pressed", String(spin));
  if (spin) document.querySelectorAll("[data-view]").forEach((button) => button.setAttribute("aria-pressed", "false"));
});
if (q.get("ui") === "0") {
  document.getElementById("tag").hidden = true;
  document.getElementById("tools").hidden = true;
}

lab.snap = (name) => {                 // render + return PNG data-url
  renderer.render(scene, cam);
  const url = renderer.domElement.toDataURL("image/png");
  if (name) console.log("[f22lab] snap:", name, url.length, "bytes");
  return url;
};

addEventListener("resize", () => {
  renderer.setSize(innerWidth, innerHeight);
  cam.aspect = innerWidth / innerHeight;
  if (!spin) park(lab.view || "three-quarter"); else cam.updateProjectionMatrix();
});

renderer.setAnimationLoop(() => {
  if (spin) orbit();
  exhaust?.update({ mach: .85, alphaDeg: 0, nz: 1 }, 1.1, 0, cam);
  renderer.render(scene, cam);
  if (!lab.ready) {
    lab.ready = true;
    document.getElementById("stats").textContent = `${lab.tris.toLocaleString()} triangles · ${backend.toUpperCase()}`;
    console.log("[f22lab] ready");
  }
});
</script>
</body>
</html>
