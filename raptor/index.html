<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAPTOR — F-22 air combat</title>
<meta name="description" content="Fly an F-22 over Nevada, Alaska, the Marianas, and New York City. Real-Earth terrain, a thirty-mission campaign, and Harbor Watch. Built for the browser, no install.">
<link rel="canonical" href="https://raptor.chall.net/">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23101014'/%3E%3Cpath d='M16 4 L19 12 L27 17 L19 19 L18 24 L21 27 L16 25 L11 27 L14 24 L13 19 L5 17 L13 12 Z' fill='%23e8b46f'/%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:title" content="RAPTOR — F-22 air combat">
<meta property="og:description" content="One aircraft, four real regions. Fly New York City and Harbor Watch. Built for the browser.">
<meta property="og:url" content="https://raptor.chall.net/">
<meta name="theme-color" content="#101014">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/src/game/flightcoach.css">
<style>
html,body{height:100%;overflow:hidden}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hangar{display:none}
#veil{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .6s ease;padding:30px}
#veil.lift{opacity:0;pointer-events:none}
#veil .status{letter-spacing:1px;font:600 16px var(--ui-font);color:var(--ink);text-align:center;line-height:1.5}
#veil .status b{color:var(--ink)}
.boot-announcement{max-width:480px;text-align:center}.boot-announcement .boot-status-detail{margin-top:10px}
.boot-steps{display:flex;list-style:none;counter-reset:boot;padding:0;margin:5px 0 0;width:min(520px,100%);gap:8px}.boot-steps li{counter-increment:boot;flex:1;text-align:center;color:var(--dim);font-size:10px;line-height:1.4}.boot-steps li:before{content:counter(boot);display:flex;align-items:center;justify-content:center;width:24px;height:24px;margin:0 auto 8px;border:1px solid var(--hair);border-radius:50%;font:10px var(--mono)}.boot-steps [data-state=current]{color:var(--acc)}.boot-steps [data-state=current]:before{border-color:var(--acc);box-shadow:0 0 0 3px #e8b46f15}.boot-steps [data-state=complete]{color:#b6d5a7}.boot-steps [data-state=complete]:before{content:'✓';border-color:#b6d5a766}.boot-steps [data-state=failed]{color:#efb591}.boot-steps [data-state=failed]:before{content:'!';border-color:#efb591}
#veil[data-failed=true] #plan{opacity:.5}#veil .boot-actions{flex-wrap:wrap;justify-content:center;margin-top:4px}
@media(max-height:650px){#veil{gap:12px;padding:20px}#veil #plan{max-height:130px;width:auto!important}.boot-steps{margin-top:0}.boot-status-detail{font-size:12px}}
#dbg{position:fixed;right:12px;top:60px;z-index:6;background:#101014dc;border:1px solid var(--hair);padding:8px 10px;font:10px var(--mono);color:var(--mid)}
#dbg #dbgTxt{margin-bottom:6px;color:var(--ink)}
</style>
</head>
<body>
<canvas id="game" aria-label="RAPTOR flight view"></canvas>

<div id="chrome"></div>
<div id="hangar"></div>

<div id="veil" role="region" aria-label="Flight preparation">
  <canvas id="plan" width="360" height="360" aria-hidden="true"></canvas>
  <div class="boot-announcement" role="status" aria-live="polite" aria-atomic="true"><div class="status">Preparing your aircraft…</div>
  <p class="boot-status-detail">Loading the flight deck. Choose your controls and flight before you launch.</p></div>
  <ol class="boot-steps" aria-label="Flight preparation stages">
    <li data-boot-step="mission" data-state="current" aria-current="step">Flight plan</li>
    <li data-boot-step="graphics-device" data-state="pending">Graphics</li>
    <li data-boot-step="landscape" data-state="pending">Landscape</li>
    <li data-boot-step="systems" data-state="pending">Flight systems</li>
    <li data-boot-step="warmup" data-state="pending">Ready to fly</li>
  </ol>
  <div class="boot-actions"><a class="ui-button" href="/">Back to preflight</a></div>
</div>

<script>
// loader planform (2D, no deps — runs before modules resolve)
(function () {
  const cv = document.getElementById("plan"), cx = cv.getContext("2d");
  const DPR = Math.min(devicePixelRatio || 1, 2);
  cv.width = 360 * DPR; cv.height = 360 * DPR;
  cv.style.width = "min(280px, 38vh, 65vw)"; cv.style.height = "auto";
  const R = [[0,0],[.045,.06],[.085,.15],[.13,.27],[.15,.36],[.5,.61],[.465,.7],[.185,.66],
             [.17,.76],[.31,.845],[.285,.93],[.095,.905],[.07,.975],[.03,1],[0,1]];
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t = 0;
  (function draw() {
    const w = cv.width, S = w * 0.6;
    cx.clearRect(0, 0, w, w);
    cx.save(); cx.translate(w/2, w/2); cx.rotate(t); cx.translate(0, -S/2);
    cx.beginPath();
    for (let i = 0; i < R.length; i++) i ? cx.lineTo(R[i][0]*S, R[i][1]*S) : cx.moveTo(R[i][0]*S, R[i][1]*S);
    for (let i = R.length - 1; i >= 0; i--) cx.lineTo(-R[i][0]*S, R[i][1]*S);
    cx.closePath();
    cx.fillStyle = "#16161c"; cx.strokeStyle = "#e8b46f"; cx.lineWidth = 1.4 * DPR;
    cx.fill(); cx.stroke(); cx.restore();
    if (!reduced && document.getElementById("veil") && !document.getElementById("veil").dataset.failed) { t += 0.02; requestAnimationFrame(draw); }
  })();
})();
</script>

<script type="importmap">
{
  "imports": {
    "three": "/vendor/three.webgpu.min.js",
    "three/webgpu": "/vendor/three.webgpu.min.js",
    "three/tsl": "/vendor/three.tsl.min.js"
  }
}
</script>
<script type="module">
// Module/network failures occur before main.js can display its graphics error.
// Keep a usable recovery route instead of leaving the loading screen spinning.
import('/src/main.js').catch(error => {
  console.error('RAPTOR could not load its game files:', error);
  const veil=document.getElementById('veil');
  if(!veil)return;
  veil.dataset.failed='true';
  veil.querySelector('.status').textContent='THE GAME FILES COULDN’T LOAD';
  const currentStep=veil.querySelector('[aria-current="step"]');
  if(currentStep)currentStep.dataset.state='failed';
  veil.querySelector('.boot-status-detail').textContent='A required game file could not load. Check your connection and reload to try again. Your saved progress and control settings are kept.';
  const retry=document.createElement('button');
  retry.className='ui-button primary';retry.textContent='Reload game';
  retry.onclick=()=>location.reload();veil.querySelector('.boot-actions').append(retry);retry.focus();
});
</script>
<script>
// PWA shell (phase 15): register after load; never blocks or races boot
if ("serviceWorker" in navigator && location.protocol === "https:") {
  addEventListener("load", () => { navigator.serviceWorker.register("/sw.js").catch(() => {}); });
}
</script>
</body>
</html>
