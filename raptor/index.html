<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAPTOR — F-22 air combat</title>
<meta name="description" content="One aircraft, three real fronts. An F-22 air combat sim built for the browser — War Thunder controls, real-Earth terrain, no install.">
<link rel="canonical" href="https://raptor.chall.net/">
<meta name="robots" content="noindex">

<meta property="og:type" content="website">
<meta property="og:title" content="RAPTOR — F-22 air combat">
<meta property="og:description" content="One aircraft, three real fronts. Built for the browser.">

<meta name="theme-color" content="#101014">
<style>
:root { --bg:#101014; --panel:#16161c; --ink:#e8e6df; --mid:#9a988f; --dim:#6e6c64; --hair:#2e2e36; --acc:#e8b46f; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:var(--bg); height:100%; overflow:hidden; }
body { color:var(--ink); font-family:"SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size:13px; }
#game { position:fixed; inset:0; width:100%; height:100%; display:block; }

/* corner chrome (evolves into the hangar UI) */
#chrome { position:fixed; top:12px; left:14px; z-index:5; pointer-events:none; }
#chrome .brand { font-weight:700; letter-spacing:6px; font-size:13px; color:var(--acc); }
#chrome .sub { color:var(--dim); font-size:9px; letter-spacing:2px; margin-top:2px; }
#chrome a { pointer-events:auto; color:var(--dim); text-decoration:none; }
#chrome a:hover { color:var(--ink); }

/* loading veil — the phase-0 planform stays as the loader */
#veil { position:fixed; inset:0; z-index:10; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
  transition:opacity .8s ease; }
#veil.lift { opacity:0; pointer-events:none; }
#veil .status { letter-spacing:3px; font-size:11px; color:var(--mid); }
#veil .status b { color:var(--ink); }

/* debug overlay */
#dbg { position:fixed; right:12px; top:12px; z-index:6; background:rgba(16,16,20,.82);
  border:1px solid var(--hair); padding:8px 10px; font-size:10px; letter-spacing:1px;
  color:var(--mid); }
#dbg #dbgTxt { margin-bottom:6px; color:var(--ink); }

/* controls screen */
#controls { display:none; position:fixed; inset:0; z-index:8; background:rgba(16,16,20,.94);
  overflow-y:auto; }
#controls.open { display:block; }
#controls .cwrap { max-width:860px; margin:40px auto 60px; padding:0 20px; }
#controls .chead { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
  border-bottom:1px solid var(--hair); padding-bottom:10px; margin-bottom:8px; }
#controls .ctitle { font-weight:700; letter-spacing:6px; color:var(--acc); font-size:14px; }
#controls .cnote { color:var(--dim); font-size:10px; letter-spacing:1.5px; flex:1; }
#controls .creset { background:none; border:1px solid var(--hair); color:var(--mid);
  font:inherit; font-size:10px; letter-spacing:1.5px; padding:4px 10px; cursor:pointer; }
#controls .creset:hover { color:var(--ink); border-color:var(--mid); }
#controls .csec { margin:20px 0 6px; color:var(--dim); letter-spacing:3px; font-size:10px;
  border-bottom:1px solid var(--hair); padding-bottom:4px; }
#controls .row { display:flex; justify-content:space-between; align-items:center; gap:12px;
  padding:5px 6px; cursor:pointer; }
#controls .row:hover { background:rgba(232,180,111,.06); }
#controls .row.cap { background:rgba(232,180,111,.12); }
#controls .rlabel { color:var(--ink); font-size:11px; letter-spacing:.5px; }
#controls .rbinds { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
#controls .chip { border:1px solid var(--hair); color:var(--mid); font-size:9px;
  letter-spacing:1.5px; padding:2px 7px; white-space:nowrap; }
#controls .chip.live { color:var(--acc); border-color:var(--acc); }
#controls .chip.warn { color:#d08770; border-color:#d08770; }
</style>
</head>
<body>
<canvas id="game" aria-label="RAPTOR flight view"></canvas>

<div id="chrome">
  <div class="brand">RAPTOR</div>
  <div class="sub">REAL SKIES · <a href="#" id="controlsLink">controls</a> · <a href="/progress.html">progress</a> · <a href="/devlog.html">devlog</a> · v0.16.2<br>
  terrain: USGS 3DEP + NAIP · <a href="https://s2maps.eu" rel="noopener">Sentinel-2 cloudless by EOX</a></div>
</div>

<div id="veil">
  <canvas id="plan" width="360" height="360" aria-hidden="true"></canvas>
  <div class="status"><b>SPOOLING ENGINES</b></div>
</div>

<script>
// loader planform (2D, no deps — runs before modules resolve)
(function () {
  const cv = document.getElementById("plan"), cx = cv.getContext("2d");
  const DPR = Math.min(devicePixelRatio || 1, 2);
  cv.width = 360 * DPR; cv.height = 360 * DPR;
  cv.style.width = "360px"; cv.style.height = "360px";
  const R = [[0,0],[.045,.06],[.085,.15],[.13,.27],[.15,.36],[.5,.61],[.465,.7],[.185,.66],
             [.17,.76],[.31,.845],[.285,.93],[.095,.905],[.07,.975],[.03,1],[0,1]];
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t = 0;
  (function draw() {
    const w = cv.width, S = w * 0.6;
    cx.clearRect(0, 0, w, w);
    cx.save(); cx.translate(w/2, w/2); cx.rotate(t); cx.translate(0, -S/2);
    cx.beginPath();
    for (let i = 0; i < R.length; i++) i ? cx.lineTo(R[i][0]*S, R[i][1]*S) : cx.moveTo(R[i][0]*S, R[i][1]*S);
    for (let i = R.length - 1; i >= 0; i--) cx.lineTo(-R[i][0]*S, R[i][1]*S);
    cx.closePath();
    cx.fillStyle = "#16161c"; cx.strokeStyle = "#e8b46f"; cx.lineWidth = 1.4 * DPR;
    cx.fill(); cx.stroke(); cx.restore();
    if (!reduced && document.getElementById("veil")) { t += 0.02; requestAnimationFrame(draw); }
  })();
})();
</script>

  "imports": {

</script>

</body>
</html>
