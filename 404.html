<style>
:root { --bg:#f6f4ee; --tex:#eeebe4; --ink:#18181c; --mid:#56565e; --dim:#6e6c64; --hair:#989690; }

.msg { color: var(--mid); margin-bottom: 18px; }

a:hover { color: var(--ink); text-decoration: underline; }
